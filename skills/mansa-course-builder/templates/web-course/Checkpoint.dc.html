<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Module 2 checkpoint</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Work+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;color:#131313;background:#f4f4f1}
a{color:#007a5e}a:hover{color:#005a45}
</style>
</helmet>
<div style="width: 1440px; height: 1400px; box-sizing: border-box; background: #f4f4f1; display: flex; flex-direction: column; font-family: 'Work Sans', system-ui, sans-serif; color: #131313;">

  <div style="display: flex; height: 6px;">
    <div style="flex-grow: 1; background: #007a5e;"></div>
    <div style="flex-grow: 1; background: #fcd116;"></div>
    <div style="flex-grow: 1; background: #c81e3a;"></div>
  </div>

  <header style="display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 32px; background: #ffffff; border-bottom: 1px solid #dedcd4;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 4px; color: #131313; text-decoration: none; font-size: 14px; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      Module 02 · The three AI schemas
    </a>
    <div style="flex-grow: 1;"></div>
    <img src="/_blob/c546a0db0050bc12539158f796628a9c" alt="MANSA" style="height: 44px; width: 138px; object-fit: cover;">
  </header>

  <main style="display: flex; justify-content: center; padding: 56px 64px 80px;">
    <div style="width: 820px; display: flex; flex-direction: column; gap: 28px;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4a4a46;">Checkpoint · unlocks Module 03</div>
        <h1 style="margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-weight: 400; font-size: 44px; line-height: 1.1;">Three questions, one per schema</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #4a4a46;">No time limit. Each answer explains itself, right or wrong.</p>
      </div>

      <sc-for list="{{questions}}" as="q" hint-placeholder-count="3">
        <fieldset style="margin: 0; display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #ffffff; border: 1px solid #dedcd4; border-radius: 4px;">
          <legend style="float: left; width: 100%; padding: 0; display: flex; flex-direction: column; gap: 8px;">
            <span style="display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: {{q.tagColor}};"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{q.dot}};"></span>{{q.tag}}</span>
            <span style="font-size: 20px; font-weight: 600; line-height: 1.4;">{{q.text}}</span>
          </legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <sc-for list="{{q.options}}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: {{o.bw}} solid {{o.border}}; border-radius: 3px; background: {{o.bg}}; color: #131313; font: inherit; text-align: left; cursor: pointer;">
                <span style="width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; border: 2px solid {{o.border}}; background: {{o.fill}};"></span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px;">{{o.label}}</span>
              </button>
            </sc-for>
          </div>
          <sc-if value="{{q.answered}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 3px; font-size: 15px; line-height: 1.55; background: {{q.feedbackBg}};">
              <span style="font-weight: 600;">{{q.verdict}}</span>
              <span style="color: #3a3a36;">{{q.why}}</span>
            </div>
          </sc-if>
        </fieldset>
      </sc-for>

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 28px; background: #131313; border-radius: 4px; color: #ffffff;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #b7b6ad;">SCORE</span>
          <span style="font-size: 22px; font-weight: 600;">{{scoreLabel}}</span>
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="button" onClick="{{reset}}" style="height: 48px; padding: 0 18px; border: 1px solid #6b6a62; border-radius: 3px; background: transparent; color: #ffffff; font: inherit; font-size: 15px; cursor: pointer;">Start over</button>
          <a href="Main.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 3px; background: #fcd116; color: #131313; text-decoration: none; font-weight: 600; font-size: 15px;">Continue to Module 03</a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picks: {} };
  }
  renderVals() {
    const bank = [
      { id: 'tree', tag: 'TREE', tagColor: '#007a5e', dot: '#007a5e',
        text: 'Which folder changes every task and is often edited by non-developers, like a supervisor or a tester?',
        options: ['.claude/skills/', 'pm/tasks/', 'src/', 'node_modules/'], answer: 1,
        why: 'pm/tasks/ is the transitional paper trail. Skills are stable tooling; src/ is the volatile product itself.' },
      { id: 'workflow', tag: 'WORKFLOW', tagColor: '#7a5a06', dot: '#fcd116',
        text: 'Which phase catches "wait, this table already exists" before any code gets written?',
        options: ['Init', 'Plan', 'Validate', 'Implement'], answer: 2,
        why: 'Validate is the one caution gate: it sanity-checks the plan against existing code before Implement.' },
      { id: 'cycle', tag: 'CYCLE', tagColor: '#c81e3a', dot: '#c81e3a',
        text: 'Detection of change and detection of skill gap sit on opposite sides of the cycle. Which category do they share?',
        options: ['Doing', 'Detecting', 'Updating', 'Shipping'], answer: 1,
        why: 'Both are checks, one on the product, one on the skill itself, so they are the same kind of step.' }
    ];
    const picks = this.state.picks;
    let correct = 0;
    let answeredCount = 0;
    const questions = bank.map((q) => {
      const picked = picks[q.id];
      const answered = picked !== undefined;
      if (answered) answeredCount += 1;
      if (answered && picked === q.answer) correct += 1;
      const ok = answered && picked === q.answer;
      return {
        tag: q.tag, tagColor: q.tagColor, dot: q.dot, text: q.text,
        answered: answered,
        verdict: ok ? 'Right.' : 'Not quite, the answer is ' + q.options[q.answer] + '.',
        why: q.why,
        feedbackBg: ok ? '#e3f3ee' : '#fbe7ea',
        options: q.options.map((label, i) => {
          const isPicked = picked === i;
          const isAnswer = answered && i === q.answer;
          const border = isAnswer ? '#007a5e' : (isPicked ? '#c81e3a' : '#b9b7ad');
          const bg = isAnswer ? '#e3f3ee' : (isPicked ? '#fbe7ea' : '#ffffff');
          return {
            label: label,
            pressed: isPicked ? 'true' : 'false',
            bw: isPicked || isAnswer ? '2px' : '1px',
            border: border,
            bg: bg,
            fill: isPicked || isAnswer ? border : 'transparent',
            pick: () => this.setState({ picks: Object.assign({}, picks, { [q.id]: i }) })
          };
        })
      };
    });
    return {
      questions: questions,
      scoreLabel: answeredCount === 0 ? 'Answer all three to unlock Module 03' : correct + ' / 3 correct' + (answeredCount < 3 ? ' so far' : ''),
      reset: () => this.setState({ picks: {} })
    };
  }
}
</script>
</body>
</html>
