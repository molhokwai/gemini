# TEST spec: pattern form-trigger (Google Form + onFormSubmit), no upsert.
spec_version = 1

[sheet]
id = "gentest-form"
title = "Gen test — Visitor log"
description = "Visitors received at the house (test sheet for the generator)"
language = "fr"
workbook = "registre-financier"
mode = "create"
layout = "table"

[[columns]]
key = "name"
header = "Nom du visiteur"
type = "text"
required = true
[[columns]]
key = "visited_on"
header = "Date de visite"
type = "date"
default = "today"
[[columns]]
key = "reason"
header = "Motif"
type = "choice"
choices = ["Famille", "Travail", "Autre"]
[[columns]]
key = "rating"
header = "Appréciation (1-5)"
type = "integer"
min = 1
max = 5
[[columns]]
key = "followup"
header = "À recontacter"
type = "boolean"
[[columns]]
key = "logged_at"
header = "Enregistré à"
type = "datetime"
default = "now"
[[columns]]
key = "comment"
header = "Commentaire"
type = "longtext"

[intake]
pattern = "form-trigger"
[intake.form]
title = "Visiteurs — formulaire"
not_given_choice = true

[channels]
skill = true
form = true

[skill]
name = "gentest-form-skill"
triggers = ["note un visiteur", "log a visitor", "enregistre la visite de"]
judgment = ["Ne jamais inventer un motif ou une appréciation"]

[life]
domain = "90-inbox"
open_loop = "none"

[appsheet]
mode = "runbook"
app = "Registre Financier — life/"
views = ["form", "table"]

[safety]
never_invent = true
scratch_test = true
keep_existing_layout = false
