# Example 3/3 — the ESCAPE HATCH: a layout that is not "one row = one record" (two-row student-day grid, one submission -> many cells).
# The writer and the form's per-question structure are hand-written; the spec still names the sheet, skill, channels, life log and safety.
spec_version = 1

[sheet]
id          = "students-grading"
title       = "Students grading"
description = "Per-question results and autonomy of a student for an exercise sheet, quiz or exam"
language    = "en"
workbook    = "registre-financier"
mode        = "adopt"
layout      = "custom"
frozen_rows = 3

[custom]
writer      = "profiles/students_grading.py"                       # hand-written profile (grid writer, CSV input)
form_script = "life/20-family/exercises/grades-form-setup.gs"      # hand-written Apps Script (per-question form + trigger)
why         = "two rows per student-day (results + autonomy row), one cell per question: not a flat table"

[intake]
pattern = "form-trigger"
[intake.form]
title            = "Students grading — daily results"
date_question    = true
not_given_choice = true

[channels]
skill = true
form  = true

[skill]
name     = "students-grading"
triggers = ["log Dang's exercises", "grade Taïna's program", "note les résultats de Maboma", "students grading"]
not_for  = "mood logs (taina-bipolar-disorder-log) or finances"
judgment = ["Never turn 'not mentioned' into 'wrong'", "Ask for the student and programme if missing"]

[life]
domain    = "20-family"
open_loop = "daily"

[appsheet]
mode = "none"

[safety]
never_invent         = true
scratch_test         = true
keep_existing_layout = true
